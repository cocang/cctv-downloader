<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCTV 下载器</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1L19.5 9"/><path d="M19.5 4v5h-5"/><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1L4.5 15"/><path d="M4.5 20v-5h5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12.5" rx="3"/><path d="M8.5 20.5h7"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M6 5h12M8.5 2.5h7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <img id="ambient-img" alt="">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img src="../assets/icons/icon128.png" alt="" class="brand-icon">
        <h1>CCTV 下载器</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn glass" id="btn-theme" title="外观" aria-label="切换外观"><svg><use href="#i-auto"/></svg></button>
        <button class="icon-btn glass" id="btn-settings" title="设置" aria-label="设置"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <div class="segmented tabs glass" role="tablist">
      <span class="seg-thumb"></span>
      <button role="tab" class="seg active" data-view="page">当前页面</button>
      <button role="tab" class="seg" data-view="jobs">下载<span class="count" id="job-count" hidden></span></button>
    </div>

    <main class="views">
      <section class="view active" id="view-page">
        <div id="page-state"></div>
        <div id="playlist-slot"></div>
        <div id="video-list" class="video-list"></div>
      </section>
      <section class="view" id="view-jobs">
        <div id="job-list" class="job-list"></div>
        <div class="list-footer" id="jobs-footer" hidden>
          <button class="text-btn" id="btn-clear"><svg><use href="#i-trash"/></svg>清除已结束</button>
        </div>
      </section>
    </main>

    <form class="omnibox glass sheen" id="omnibox" autocomplete="off">
      <svg class="omni-icon"><use href="#i-link"/></svg>
      <input id="omni-input" type="text" placeholder="粘贴视频或直播链接" spellcheck="false" aria-label="视频链接">
      <button type="submit" class="omni-go" aria-label="打开"><svg><use href="#i-arrow"/></svg></button>
    </form>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" inert>
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">设置</h2>
      <button class="pill-btn" id="btn-sheet-done">完成</button>
    </div>
    <div class="group glass">
      <div class="row">
        <span>外观</span>
        <div class="segmented mini" id="set-theme">
          <span class="seg-thumb"></span>
          <button class="seg" data-value="auto">自动</button>
          <button class="seg" data-value="light">浅色</button>
          <button class="seg" data-value="dark">深色</button>
        </div>
      </div>
    </div>
    <div class="group glass">
      <div class="row">
        <span>同时下载</span>
        <div class="stepper" data-key="maxJobs" data-min="1" data-max="4">
          <button type="button" data-step="-1" aria-label="减少">−</button><output>2</output><button type="button" data-step="1" aria-label="增加">+</button>
        </div>
      </div>
    </div>
    <div class="group glass">
      <label class="row">
        <span>存储文件夹</span>
        <input type="text" id="set-folder" placeholder="下载" spellcheck="false">
      </label>
      <label class="row">
        <span>下载前询问存储位置</span>
        <input type="checkbox" class="switch" id="set-saveas">
      </label>
    </div>
    <div class="group glass">
      <label class="row">
        <span>下载完成时通知</span>
        <input type="checkbox" class="switch" id="set-notify">
      </label>

    </div>
  </section>

  <section class="sheet tall" id="pl-sheet" role="dialog" aria-modal="true" aria-labelledby="pl-title" inert>
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <div>
        <h2 id="pl-title">批量下载</h2>
        <p class="sheet-sub" id="pl-sub"></p>
      </div>
      <button class="pill-btn ghost" id="pl-close">取消</button>
    </div>
    <div class="pl-tools">
      <button class="text-btn strong" id="pl-all">全选</button>
      <div class="segmented mini" id="pl-quality" aria-label="清晰度">
        <span class="seg-thumb"></span>
        <button class="seg" data-value="best">最高</button>
        <button class="seg" data-value="1080">1080P</button>
        <button class="seg" data-value="720">720P</button>
        <button class="seg" data-value="360">360P</button>
      </div>
    </div>
    <div class="pl-list" id="pl-list" role="listbox" aria-multiselectable="true"></div>
    <button class="primary-btn" id="pl-go" disabled><svg><use href="#i-down"/></svg><span>下载</span></button>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="tpl-video">
    <article class="card video glass sheen">
      <div class="cover">
        <img alt="" loading="lazy">
        <span class="chip duration"></span>
      </div>
      <div class="card-body">
        <div class="eyebrow"><span class="channel"></span><span class="date"></span></div>
        <h3 class="title"></h3>
        <div class="chips quality" role="radiogroup" aria-label="清晰度"></div>
        <button class="primary-btn download"><svg><use href="#i-down"/></svg><span>下载</span></button>
      </div>
    </article>
  </template>

  <template id="tpl-job">
    <article class="job glass sheen">
      <div class="job-thumb"><img alt=""></div>
      <div class="job-main">
        <div class="job-title"></div>
        <div class="job-meta"></div>
        <div class="progress"><span></span></div>
      </div>
      <div class="job-actions"></div>
    </article>
  </template>

  <script src="../core/color.js"></script>
  <script src="popup.js"></script>
</body>
</html>
